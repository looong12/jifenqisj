<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, viewport‑fit=cover">
<!-- 下面这条只是提示浏览器优先横屏，不能强制横屏！ -->
<meta name="screen-orientation" content="landscape">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#07080c">
<title>乒乓球记分器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
body{
    background:
        radial-gradient(circle at 20% 10%, rgba(120,160,255,0.08), transparent 26%),
        radial-gradient(circle at 80% 90%, rgba(255,215,120,0.05), transparent 28%),
        linear-gradient(180deg,#07080c 0%, #0c0e14 45%, #07080c 100%);
    color:#e8e8e8;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow:auto;
    padding:16px 20px;
}
.scale-wrap {
    transform-origin: center top;
    will-change: transform;
    width: 1200px;
    max-width:100%;
    overflow:visible;
}
.wrap-rotate{
    width:100%;
    max-width:1200px;
    position:relative;
}
.container{
    width:100%;
    padding:0;
}
.head-line{
    display:flex;
    gap:24px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    margin:8px 0 18px;
}
#timer{
    font-size:clamp(20px,2.2vw,26px);
    font-weight:500;
    letter-spacing:1px;
    color:#cfd6e4;
}
#timer::before{
    content:"";
    display:inline-block;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#7aa2ff;
    vertical-align:middle;
    margin-right:10px;
    box-shadow:0 0 12px rgba(122,162,255,0.9);
}
#setInfo{
    font-size:clamp(20px,2.2vw,26px);
    font-weight:500;
    letter-spacing:1px;
    color:#cfd6e4;
}
.score-box{
    display:flex;
    gap:clamp(12px,2vw,20px);
    width:100%;
    align-items:stretch;
}
@media (max-width:850px){
    .score-box{
        flex-direction:column;
    }
}
.team{
    flex:1;
    background:
        linear-gradient(180deg, #1c2030 0%, #141722 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(14px,2vw,22px) clamp(12px,1.8vw,18px);
    box-shadow:
        0 30px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.06);
}
.name-row{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    position:relative;
    margin-bottom:0px; /* 加大名字区域下边距，抬高名字区域高度 */
    padding:0px 0 16px 0;     /* 增加上下内边距，名字区域加高 */
}
.name-row .ball{
    position:absolute;
    left:0;
}
.name-row.right-ball .ball{
    left:auto;
    right:0;
}
.name-input{
    font-size:clamp(26px,3.4vw,100px);
    font-weight:600;
    text-align:center;
    background:transparent;
    border:none;
    outline:none;
    color:#f5f5f7;
    padding:6px;
    width:400px;
}
.name-red{
    background:linear-gradient(180deg,#ffd1d1 0%, #ff7474 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.name-blue{
    background:linear-gradient(180deg,#d3e4ff 0%, #6aa9ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.ball {
    width:clamp(26px,2.8vw,34px);
    height:clamp(26px,2.8vw,34px);
    border-radius:50%;
    background:
        radial-gradient(circle at 30% 25%, #fff6c4, #ffd46b 45%, #d79a14 100%);
    border:2px solid rgba(255,255,255,0.9);
    box-shadow:
        0 0 0 1px rgba(0,0,0,0.55),
        0 0 14px rgba(255,212,107,0.35);
    opacity:0;
    transform:scale(0.55);
    transition:all 0.25s ease;
    flex-shrink:0;
}
.ball.active {
    opacity:1;
    transform:scale(1);
    box-shadow:
        0 0 0 2px #000000,
        0 0 0 4px #ffd46b,
        0 0 18px rgba(255,212,107,0.95),
        0 0 34px rgba(255,170,0,0.55);
}
.game-count{
    font-size:clamp(22px,2.6vw,28px);;
    font-weight:600;
    letter-spacing:2px;
    color:#b8892a;
    margin-bottom:16px;
}
.game-count span{
    color:#ffd46b;
    font-weight:700;
}
.score-wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:clamp(16px,2.5vh,28px) clamp(16px,2vw,26px);
    min-height:28vh; /* 降低比分盒子最小高度，不挤压分数显示 */
    max-height:52vh;
    background:
        linear-gradient(180deg, #242840 0%, #1a1d2c 100%);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:20px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 10px 30px rgba(0,0,0,0.35);
}
.score-holder{
    flex:1;
    min-width:120px;
    max-width:260px;
    container-type: inline-size;
    text-align:center;
    overflow:hidden;
}
.score{
    font-size:clamp(80px, 65cqi, 260px);
    font-weight:800;
    line-height:1;
    letter-spacing:-4px;
    font-variant-numeric: tabular-nums;
    display:inline-block;
}
.score-red{
    background:linear-gradient(180deg,#ffecec 0%, #ff8080 35%, #d14040 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,70,70,0.45));
}
.score-blue{
    background:linear-gradient(180deg,#eaf2ff 0%, #8cb4ff 35%, #3f78e0 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 22px rgba(60,120,255,0.45));
}
.btn-group{
    display:flex;
    flex-direction:column;
    gap:clamp(12px,2vw,18px);
}
button{
    transition:
        transform 0.12s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease,
        background 0.18s ease;
    will-change:transform;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}
button:hover{
    filter:brightness(1.08);
}
button:active{
    transform:scale(0.92);
    filter:brightness(0.82) saturate(1.1);
}
.btn-group button{
    width:clamp(50px,7vw,72px);
    height:clamp(50px,7vw,72px);
    font-size:clamp(22px,3vw,32px);
    border:none;
    border-radius:16px;
    cursor:pointer;
    font-weight:700;
    color:#fff;
    background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.09);
    box-shadow:
        0 10px 24px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.06);
}
.btn-group button:active{
    box-shadow:
        0 2px 8px rgba(0,0,0,0.55),
        inset 0 1px 2px rgba(0,0,0,0.35);
}
.ctrl{
    margin-top:22px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:clamp(8px,1.5vw,14px);
}
.ctrl button{
    padding:clamp(10px,1.5vh,14px) 6px;
    font-size:clamp(13px,1.8vw,18px);
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:600;
    letter-spacing:1px;
    color:#1a1a1a;
    background:linear-gradient(180deg,#ffe9a8 0%, #ffd24d 100%);
    box-shadow:
        0 10px 24px rgba(255,180,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.4);
}
.ctrl button:active{
    box-shadow:
        0 2px 8px rgba(255,180,0,0.35),
        inset 0 1px 2px rgba(0,0,0,0.25);
}
#switchServerBtn{
    background:linear-gradient(180deg,#ffe9a8 0%, #ffd24d 100%);
    color:#1a1a1a;
}
.confirm-mask{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
}
.confirm-mask.show{
    display:flex;
}
.confirm-box{
    width:min(480px, 90vw);
    background:
        linear-gradient(180deg, #1c2030 0%, #141722 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:22px;
    padding:26px 24px 22px;
    box-shadow:
        0 30px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.06);
}
.confirm-title{
    font-size:clamp(17px,2vw,20px);
    font-weight:700;
    color:#ffd46b;
    margin-bottom:12px;
    letter-spacing:2px;
}
.confirm-text{
    font-size:clamp(15px,1.8vw,18px);
    line-height:1.6;
    color:#e5e7ef;
    margin-bottom:22px;
}
.confirm-btns{
    display:flex;
    justify-content:flex-end;
    gap:12px;
}
.confirm-btns button{
    padding:11px 22px;
    font-size:clamp(14px,1.6vw,17px);
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:600;
    letter-spacing:1px;
}
.confirm-cancel{
    background:linear-gradient(180deg,#2a2f42 0%, #1a1d2c 100%);
    color:#cfd6e4;
    border:1px solid rgba(255,255,255,0.08);
}
.confirm-ok{
    background:linear-gradient(180deg,#ffe9a8 0%, #ffd24d 100%);
    color:#1a1a1a;
    box-shadow:
        0 10px 24px rgba(255,180,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.4);
}
.btn-option-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}
.btn-option-group button{
    flex:1;
    min-width:80px;
    padding:12px 8px;
}
</style>
</head>
<body>
<div class="scale-wrap">
<div class="wrap-rotate" id="wrapRotate">
    <div class="confirm-mask" id="confirmMask">
        <div class="confirm-box">
            <div class="confirm-title">提示</div>
            <div class="confirm-text" id="confirmText"></div>
            <div class="btn-option-group" id="optionGroup" style="display:none;">
                <!-- 局数选择选项会动态插入这里 -->
            </div>
            <div class="confirm-btns" id="confirmBtnWrap">
                <button class="confirm-cancel" id="confirmCancelBtn">取消</button>
                <button class="confirm-ok" id="confirmOkBtn">确定</button>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="head-line">
            <div id="timer">比赛时间：00:00</div>
            <div id="setInfo">赛制：不限局数</div>
        </div>
        <div class="score-box">
            <div class="team">
                <div class="name-row">
                    <span id="ballLeft" class="ball"></span>
                    <input id="nameLeft" class="name-input name-red" placeholder="选手A">
                </div>
                <span class="game-count">胜局：<span id="winLeft">0</span></span>
                <div class="score-wrap">
                    <div class="btn-group">
                        <button class="add" onclick="addLeft()">+</button>
                        <button class="sub" onclick="subLeft()">−</button>
                    </div>
                    <div class="score-holder">
                        <div class="score score-red" id="scoreLeft">0</div>
                    </div>
                    <div></div>
                </div>
            </div>
            <div class="team">
                <div class="name-row right-ball">
                    <span id="ballRight" class="ball"></span>
                    <input id="nameRight" class="name-input name-blue" placeholder="选手B">
                </div>
                <span class="game-count">胜局：<span id="winRight">0</span></span>
                <div class="score-wrap">
                    <div></div>
                    <div class="score-holder">
                        <div class="score score-blue" id="scoreRight">0</div>
                    </div>
                    <div class="btn-group">
                        <button class="add" onclick="addRight()">+</button>
                        <button class="sub" onclick="subRight()">−</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="ctrl">
            <button onclick="swapPlayer()">交换位置</button>
            <button id="switchServerBtn" onclick="manualSwitchServer()">切换发球</button>
            <button onclick="resetAll()">全部清零</button>
            <button id="toggleTimerBtn" onclick="toggleTimer()">开始计时</button>
            <button onclick="openSetSelect()">选择局数</button>
        </div>
    </div>
</div>
</div>
<script>
// 5+App就绪后自动开启全屏，H5浏览器环境会自动跳过，不报错
function plusReady() {
    if (window.plus) {
        plus.navigator.setFullscreen(true); // true=全屏隐藏状态栏；false退出全屏
    }
}
if(window.plus){
    plusReady();
}else{
    document.addEventListener("plusready", plusReady, false);
}

let leftScore = 0, rightScore = 0;
let winLeft = 0, winRight = 0;
let serverSide = 'left';
let serveCount = 0;
let timerInterval = null;
let seconds = 0;
let gameOver = false;
// 赛制配置：目标胜局；null=不限局数
let targetWin = null; // 默认不限局数
const nameLeft = document.getElementById('nameLeft');
const nameRight = document.getElementById('nameRight');
const scoreLeftDom = document.getElementById('scoreLeft');
const scoreRightDom = document.getElementById('scoreRight');
const winLeftDom = document.getElementById('winLeft');
const winRightDom = document.getElementById('winRight');
const timerDom = document.getElementById('timer');
const toggleTimerBtn = document.getElementById('toggleTimerBtn');
const ballLeft = document.getElementById('ballLeft');
const ballRight = document.getElementById('ballRight');
const wrapRotate = document.getElementById('wrapRotate');
const confirmMask = document.getElementById('confirmMask');
const confirmText = document.getElementById('confirmText');
const confirmOkBtn = document.getElementById('confirmOkBtn');
const confirmCancelBtn = document.getElementById('confirmCancelBtn');
const optionGroup = document.getElementById('optionGroup');
const confirmBtnWrap = document.getElementById('confirmBtnWrap');
const setInfo = document.getElementById('setInfo');
const scaleWrap = document.querySelector('.scale-wrap');
let confirmCallback = null;
function autoScaleLayout(){
    const baseWidth = 1200;
    const maxScale = 1.2;
    const minScale = 0.4;
    // 使用 window.screen.width 兼容手机横竖屏
    const windowW = Math.max(document.documentElement.clientWidth, window.innerWidth);
    let scale = windowW / baseWidth;
    scale = Math.max(minScale, Math.min(maxScale, scale));
    scaleWrap.style.transform = `scale(${scale}) translateZ(0)`;
    scaleWrap.style.width = `${baseWidth}px`;
}
window.addEventListener('resize',autoScaleLayout);
window.addEventListener('orientationchange',autoScaleLayout);
function showConfirm(text, onOk){
    confirmText.innerText = text;
    confirmCallback = onOk;
    confirmMask.classList.add('show');
    optionGroup.style.display = 'none';
    confirmBtnWrap.style.display = 'flex';
}
function closeConfirm(){
    confirmMask.classList.remove('show');
    confirmCallback = null;
}
confirmOkBtn.addEventListener('click',function(e){
    e.stopPropagation();
    const cb = confirmCallback;
    closeConfirm();
    if(cb) cb();
});
confirmCancelBtn.addEventListener('click',function(e){
    e.stopPropagation();
    closeConfirm();
});
confirmMask.addEventListener('click',function(e){
    if(e.target === confirmMask){
        closeConfirm();
    }
});
// 计时合并按钮：切换开始/暂停
function toggleTimer(){
    if(timerInterval){
        //正在运行 → 停止
        clearInterval(timerInterval);
        timerInterval = null;
        toggleTimerBtn.innerText = "继续计时";
    }else{
        //未运行 → 启动
        timerInterval = setInterval(()=>{
            seconds++;
            const min = String(Math.floor(seconds/60)).padStart(2,'0');
            const sec = String(seconds%60).padStart(2,'0');
            timerDom.innerText=`比赛时间：${min}:${sec}`;
        },1000);
        toggleTimerBtn.innerText = "暂停计时";
    }
}
// 打开选择局数弹窗
function openSetSelect(){
    confirmMask.classList.add('show');
    confirmText.innerText = "请选择比赛赛制";
    confirmBtnWrap.style.display = 'none';
    optionGroup.style.display = 'flex';
    optionGroup.innerHTML = "";
    const sets = [
        {name:"3局2胜", val:2},
        {name:"5局3胜", val:3},
        {name:"7局4胜", val:4},
        {name:"不限局数", val:null}
    ];
    sets.forEach(s=>{
        const btn = document.createElement('button');
        btn.innerText = s.name;
        btn.onclick = ()=>{
            targetWin = s.val;
            setInfo.innerText = `赛制：${s.name}`;
            closeConfirm();
        };
        optionGroup.appendChild(btn);
    })
}
function render(){
    scoreLeftDom.innerText = leftScore;
    scoreRightDom.innerText = rightScore;
    winLeftDom.innerText = winLeft;
    winRightDom.innerText = winRight;
    checkWin();
    updateServerTip();
}
function addLeft(){
    // targetWin不为null（有限局数）才判断整场结束锁分；不限局不锁
    if(targetWin !== null && (winLeft >= targetWin || winRight >= targetWin)) return;
    if(gameOver){
        leftScore=0;
        rightScore=0;
        swapPlayer();
        serveCount=0;
        gameOver=false;
        render();
        return;
    }
    leftScore++;
    handleServeAfterPoint();
    render()
}
function subLeft(){
    if(leftScore>0){
        if(gameOver){
            if(leftScore > rightScore){
                winLeft--;
            }else{
                winRight--;
            }
            gameOver = false;
        }
        leftScore--;
        recalcServer();
    }
    render()
}
function addRight(){
    if(targetWin !== null && (winLeft >= targetWin || winRight >= targetWin)) return;
    if(gameOver){
        leftScore=0;
        rightScore=0;
        swapPlayer();
        serveCount=0;
        gameOver=false;
        render();
        return;
    }
    rightScore++;
    handleServeAfterPoint();
    render()
}
function subRight(){
    if(rightScore>0){
        if(gameOver){
            if(rightScore > leftScore){
                winRight--;
            }else{
                winLeft--;
            }
            gameOver = false;
        }
        rightScore--;
        recalcServer();
    }
    render()
}
function handleServeAfterPoint(){
    const total = leftScore + rightScore;
    const deuce = (leftScore >=10 && rightScore >=10);
    serveCount++;
    if( (deuce && serveCount >=1) || (!deuce && serveCount >=2) ){
        serverSide = serverSide === 'left' ? 'right' : 'left';
        serveCount = 0;
    }
}
function recalcServer(){
    const total = leftScore + rightScore;
    const deuce = (leftScore >=10 && rightScore >=10);
    const servePer = deuce ? 1 : 2;
    const totalServes = Math.floor(total / servePer);
    serverSide = (totalServes %2 ===0) ? 'left' : 'right';
    serveCount = total % servePer;
}
function updateServerTip(){
    ballLeft.classList.remove('active');
    ballRight.classList.remove('active');
    if(serverSide === 'left'){
        ballLeft.classList.add('active');
    }else{
        ballRight.classList.add('active');
    }
}
function manualSwitchServer(){
    serverSide = serverSide === 'left' ? 'right' : 'left';
    serveCount = 0;
    updateServerTip();
}
function swapPlayer(){
    //交换输入框名字
    const tempName = nameLeft.value;
    nameLeft.value = nameRight.value;
    nameRight.value = tempName;

    //交换胜局
    const tempWin = winLeft;
    winLeft = winRight;
    winRight = tempWin;

    //✅【修复】交换本局当前比分
    const tempScore = leftScore;
    leftScore = rightScore;
    rightScore = tempScore;

    //交换颜色class
    nameLeft.classList.toggle('name-red');
    nameLeft.classList.toggle('name-blue');
    nameRight.classList.toggle('name-red');
    nameRight.classList.toggle('name-blue');
    scoreLeftDom.classList.toggle('score-red');
    scoreLeftDom.classList.toggle('score-blue');
    scoreRightDom.classList.toggle('score-red');
    scoreRightDom.classList.toggle('score-blue');

    //✅【修复】换边之后发球方也要互换
    serverSide = serverSide === 'left' ? 'right' : 'left';
    serveCount = 0;

    //✅【修复】必须调用render刷新界面！之前缺少这句，界面不更新
    render();
}

function checkWin(){
    const diff = Math.abs(leftScore - rightScore);
    if((leftScore >=11 || rightScore >=11) && diff >=2 && !gameOver){
        if(leftScore > rightScore){
            winLeft++;
        }else{
            winRight++;
        }
        gameOver = true;
    }
}
function resetGame(){
    showConfirm("确定要重置本局当前比分吗？胜局将保留。", function(){
        leftScore=0;
        rightScore=0;
        gameOver = false;
        serveCount=0;
        serverSide='left';
        ballLeft.classList.remove('active');
        ballRight.classList.remove('active');
        render();
    });
}
function resetAll(){
    showConfirm("确定要全部清零？比分、胜局、计时全部清空，选手名字保留。", function(){
        leftScore=0;
        rightScore=0;
        winLeft=0;
        winRight=0;
        gameOver=false;
        seconds=0;
        serveCount=0;
        serverSide='left';
        stopTimerInner();
        toggleTimerBtn.innerText = "开始计时";
        timerDom.innerText="比赛时间：00:00";
        ballLeft.classList.remove('active');
        ballRight.classList.remove('active');
        render();
    });
}
//内部停止计时
function stopTimerInner(){
    clearInterval(timerInterval);
    timerInterval=null;
}
render();
autoScaleLayout();
</script>
</body>
</html>
