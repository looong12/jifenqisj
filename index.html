<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0">
<title>乒乓球记分器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
body{
    background:
        radial-gradient(circle at 20% 10%, rgba(120,160,255,0.08), transparent 26%),
        radial-gradient(circle at 80% 90%, rgba(255,215,120,0.05), transparent 28%),
        linear-gradient(180deg,#07080c 0%, #0c0e14 45%, #07080c 100%);
    color:#e8e8e8;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:auto;
}
/* 整体容器顺时针旋转90度 */
.wrap-rotate{
    width:100vh;
    height:100vw;
    transform: rotate(90deg);
    transform-origin: center center;
    position:relative;
}
.container{
    width:100%;
    padding:0 14px;
}
#timer{
    font-size:clamp(17px,3.6vw,26px);
    font-weight:500;
    letter-spacing:1px;
    text-align:center;
    margin:6px 0 12px;
    color:#cfd6e4;
}
#timer::before{
    content:"";
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#7aa2ff;
    vertical-align:middle;
    margin-right:8px;
    box-shadow:0 0 12px rgba(122,162,255,0.9);
}
.score-box{
    display:flex;
    gap:min(2vw,14px);
    width:100%;
    align-items:stretch;
}
.team{
    flex:1;
    background:
        linear-gradient(180deg, #1c2030 0%, #141722 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 14px;
    box-shadow:
        0 30px 60px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.06);
}
/* 修复左右边距不一致：两端对齐 */
.name-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    margin-bottom:10px;
}
.name-row .ball{
    order:1;
}
.name-row .name-input{
    order:2;
}
.name-row.right-ball .ball{
    order:2;
}
.name-row.right-ball .name-input{
    order:1;
}
.name-input{
    font-size:clamp(18px,4vw,26px);
    font-weight:600;
    text-align:center;
    background:transparent;
    border:none;
    outline:none;
    color:#f5f5f7;
    padding:4px;
    width:auto;
}
.name-red{
    background:linear-gradient(180deg,#ffd1d1 0%, #ff7474 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
.name-blue{
    background:linear-gradient(180deg,#d3e4ff 0%, #6aa9ff 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}
/* 发球指示小球：保持强识别 */
.ball {
    width:clamp(22px,5vw,32px);
    height:clamp(22px,5vw,32px);
    border-radius:50%;
    background:
        radial-gradient(circle at 30% 25%, #fff6c4, #ffd46b 45%, #d79a14 100%);
    border:2px solid rgba(255,255,255,0.9);
    box-shadow:
        0 0 0 1px rgba(0,0,0,0.55),
        0 0 14px rgba(255,212,107,0.35);
    opacity:0;
    transform:scale(0.55);
    transition:all 0.25s ease;
    flex-shrink:0;
}
.ball.active {
    opacity:1;
    transform:scale(1);
    box-shadow:
        0 0 0 2px #000000,
        0 0 0 4px #ffd46b,
        0 0 18px rgba(255,212,107,0.95),
        0 0 34px rgba(255,170,0,0.55);
}
.game-count{
    font-size:clamp(15px,2.8vw,19px);
    font-weight:600;
    letter-spacing:2px;
    color:#b8892a;
    margin-bottom:12px;
}
.game-count span{
    color:#ffd46b;
    font-weight:700;
}
/* 比分盒子：冷灰蓝玻璃质感 */
.score-wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:16px 14px;
    min-height:clamp(150px,34vw,240px);
    background:
        linear-gradient(180deg, #242840 0%, #1a1d2c 100%);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:18px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05),
        0 10px 30px rgba(0,0,0,0.35);
}
/* 比分数字：低饱和金属红蓝 */
.score{
    font-size:clamp(140px,38vw,260px);
    font-weight:800;
    line-height:1;
    letter-spacing:-4px;
    font-variant-numeric:tabular-nums;
}
.score-red{
    background:linear-gradient(180deg,#ffecec 0%, #ff8080 35%, #d14040 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,70,70,0.45));
}
.score-blue{
    background:linear-gradient(180deg,#eaf2ff 0%, #8cb4ff 35%, #3f78e0 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(60,120,255,0.45));
}
.btn-group{
    display:flex;
    flex-direction:column;
    gap:14px;
}
/* 所有按钮统一点击动效 */
button{
    transition:
        transform 0.12s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease,
        background 0.18s ease;
    will-change:transform;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}
button:hover{
    filter:brightness(1.08);
}
button:active{
    transform:scale(0.92);
    filter:brightness(0.82) saturate(1.1);
}
.btn-group button{
    width:clamp(48px,11vw,66px);
    height:clamp(48px,11vw,66px);
    font-size:clamp(22px,5vw,28px);
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:700;
    color:#fff;
    background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.09);
    box-shadow:
        0 10px 24px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.06);
}
.btn-group button:active{
    box-shadow:
        0 2px 8px rgba(0,0,0,0.55),
        inset 0 1px 2px rgba(0,0,0,0.35);
}
.add{
    background:linear-gradient(180deg,#4aa3ff 0%, #254fa5 100%);
}
.sub{
    background:linear-gradient(180deg,#ff845a 0%, #b23a1a 100%);
}
.ctrl{
    margin-top:16px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:min(1.5vw,8px);
}
.ctrl button{
    padding:clamp(8px,1.4vw,10px) 4px;
    font-size:clamp(12px,2vw,14px);
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    letter-spacing:1px;
    color:#1a1a1a;
    background:linear-gradient(180deg,#ffe9a8 0%, #ffd24d 100%);
    box-shadow:
        0 10px 24px rgba(255,180,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.4);
}
.ctrl button:active{
    box-shadow:
        0 2px 8px rgba(255,180,0,0.35),
        inset 0 1px 2px rgba(0,0,0,0.25);
}
#switchServerBtn{
    background:linear-gradient(180deg,#c9a35a 0%, #7a5a1f 100%);
    color:#fff;
}

/* ==========自定义二次确认弹窗【放在rotate容器内，跟着一起旋转】========== */
.confirm-mask{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
}
.confirm-mask.show{
    display:flex;
}
.confirm-box{
    width:min(420px, 86vw);
    background:
        linear-gradient(180deg, #1c2030 0%, #141722 100%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:22px 20px 18px;
    box-shadow:
        0 30px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.06);
}
.confirm-title{
    font-size:clamp(15px,2.4vw,17px);
    font-weight:700;
    color:#ffd46b;
    margin-bottom:10px;
    letter-spacing:2px;
}
.confirm-text{
    font-size:clamp(14px,2.2vw,16px);
    line-height:1.6;
    color:#e5e7ef;
    margin-bottom:18px;
}
.confirm-btns{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}
.confirm-btns button{
    padding:9px 18px;
    font-size:clamp(13px,2vw,15px);
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
    letter-spacing:1px;
}
.confirm-cancel{
    background:linear-gradient(180deg,#2a2f42 0%, #1a1d2c 100%);
    color:#cfd6e4;
    border:1px solid rgba(255,255,255,0.08);
}
.confirm-ok{
    background:linear-gradient(180deg,#ffe9a8 0%, #ffd24d 100%);
    color:#1a1a1a;
    box-shadow:
        0 10px 24px rgba(255,180,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.4);
}
</style>
</head>
<body>

<div class="wrap-rotate">
    <div class="confirm-mask" id="confirmMask">
        <div class="confirm-box">
            <div class="confirm-title">提示</div>
            <div class="confirm-text" id="confirmText"></div>
            <div class="confirm-btns">
                <button class="confirm-cancel" id="confirmCancelBtn">取消</button>
                <button class="confirm-ok" id="confirmOkBtn">确定</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="timer">比赛时间：00:00</div>
        <div class="score-box">
            <div class="team">
                <div class="name-row">
                    <span id="ballLeft" class="ball"></span>
                    <input id="nameLeft" class="name-input name-red" placeholder="选手A" value="选手A">
                </div>
                <span class="game-count">胜局：<span id="winLeft">0</span></span>
                <div class="score-wrap">
                    <div class="btn-group">
                        <button class="add" onclick="addLeft()">+</button>
                        <button class="sub" onclick="subLeft()">−</button>
                    </div>
                    <div class="score score-red" id="scoreLeft">0</div>
                    <div></div>
                </div>
            </div>
            <div class="team">
                <div class="name-row right-ball">
                    <span id="ballRight" class="ball"></span>
                    <input id="nameRight" class="name-input name-blue" placeholder="选手B" value="选手B">
                </div>
                <span class="game-count">胜局：<span id="winRight">0</span></span>
                <div class="score-wrap">
                    <div></div>
                    <div class="score score-blue" id="scoreRight">0</div>
                    <div class="btn-group">
                        <button class="add" onclick="addRight()">+</button>
                        <button class="sub" onclick="subRight()">−</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="ctrl">
            <button onclick="resetGame()">重置本局</button>
            <button onclick="resetAll()">全部清零</button>
            <button id="switchServerBtn" onclick="manualSwitchServer()">切换发球</button>
            <button onclick="startTimer()">开始计时</button>
            <button onclick="stopTimer()">停止计时</button>
        </div>
    </div>
</div>

<script>
let leftScore = 0, rightScore = 0;
let winLeft = 0, winRight = 0;
let serverSide = 'left';
let serveCount = 0;
let timerInterval = null;
let seconds = 0;
let gameOver = false;
const nameLeft = document.getElementById('nameLeft');
const nameRight = document.getElementById('nameRight');
const scoreLeftDom = document.getElementById('scoreLeft');
const scoreRightDom = document.getElementById('scoreRight');
const winLeftDom = document.getElementById('winLeft');
const winRightDom = document.getElementById('winRight');
const timerDom = document.getElementById('timer');
const ballLeft = document.getElementById('ballLeft');
const ballRight = document.getElementById('ballRight');

// ==========自定义确认弹窗逻辑（修复冒泡bug）==========
const confirmMask = document.getElementById('confirmMask');
const confirmText = document.getElementById('confirmText');
const confirmOkBtn = document.getElementById('confirmOkBtn');
const confirmCancelBtn = document.getElementById('confirmCancelBtn');
let confirmCallback = null;

function showConfirm(text, onOk){
    confirmText.innerText = text;
    confirmCallback = onOk;
    confirmMask.classList.add('show');
}
function closeConfirm(){
    confirmMask.classList.remove('show');
    confirmCallback = null;
}

// 确定按钮
confirmOkBtn.addEventListener('click',function(e){
    e.stopPropagation();
    const cb = confirmCallback;
    closeConfirm();
    if(cb) cb();
});
// 取消按钮
confirmCancelBtn.addEventListener('click',function(e){
    e.stopPropagation();
    closeConfirm();
});
// 点击遮罩空白关闭
confirmMask.addEventListener('click',function(e){
    if(e.target === confirmMask){
        closeConfirm();
    }
});

function render(){
    scoreLeftDom.innerText = leftScore;
    scoreRightDom.innerText = rightScore;
    winLeftDom.innerText = winLeft;
    winRightDom.innerText = winRight;
    checkWin();
    updateServerTip();
}
function addLeft(){
    if(gameOver){
        leftScore=0;
        rightScore=0;
        swapPlayer();
        serveCount=0;
        gameOver=false;
        render();
        return;
    }
    leftScore++;
    handleServeAfterPoint();
    render()
}
function subLeft(){
    if(leftScore>0){
        if(gameOver){
            if(leftScore > rightScore){
                winLeft--;
            }else{
                winRight--;
            }
            gameOver = false;
        }
        leftScore--;
        recalcServer();
    }
    render()
}
function addRight(){
    if(gameOver){
        leftScore=0;
        rightScore=0;
        swapPlayer();
        serveCount=0;
        gameOver=false;
        render();
        return;
    }
    rightScore++;
    handleServeAfterPoint();
    render()
}
function subRight(){
    if(rightScore>0){
        if(gameOver){
            if(rightScore > leftScore){
                winRight--;
            }else{
                winLeft--;
            }
            gameOver = false;
        }
        rightScore--;
        recalcServer();
    }
    render()
}
function handleServeAfterPoint(){
    const total = leftScore + rightScore;
    const deuce = (leftScore >=10 && rightScore >=10);
    serveCount++;
    if( (deuce && serveCount >=1) || (!deuce && serveCount >=2) ){
        serverSide = serverSide === 'left' ? 'right' : 'left';
        serveCount = 0;
    }
}
function recalcServer(){
    const total = leftScore + rightScore;
    const deuce = (leftScore >=10 && rightScore >=10);
    const servePer = deuce ? 1 : 2;
    const totalServes = Math.floor(total / servePer);
    serverSide = (totalServes %2 ===0) ? 'left' : 'right';
    serveCount = total % servePer;
}
function updateServerTip(){
    ballLeft.classList.remove('active');
    ballRight.classList.remove('active');
    if(serverSide === 'left'){
        ballLeft.classList.add('active');
    }else{
        ballRight.classList.add('active');
    }
}
function manualSwitchServer(){
    serverSide = serverSide === 'left' ? 'right' : 'left';
    serveCount = 0;
    updateServerTip();
}
function swapPlayer(){
    const tempName = nameLeft.value;
    nameLeft.value = nameRight.value;
    nameRight.value = tempName;
    const tempWin = winLeft;
    winLeft = winRight;
    winRight = tempWin;
    nameLeft.classList.toggle('name-red');
    nameLeft.classList.toggle('name-blue');
    nameRight.classList.toggle('name-red');
    nameRight.classList.toggle('name-blue');
    scoreLeftDom.classList.toggle('score-red');
    scoreLeftDom.classList.toggle('score-blue');
    scoreRightDom.classList.toggle('score-red');
    scoreRightDom.classList.toggle('score-blue');
}
function checkWin(){
    const diff = Math.abs(leftScore - rightScore);
    if((leftScore >=11 || rightScore >=11) && diff >=2 && !gameOver){
        if(leftScore > rightScore){
            winLeft++;
        }else{
            winRight++;
        }
        gameOver = true;
    }
}
function resetGame(){
    showConfirm("确定要重置本局当前比分吗？胜局将保留。", function(){
        leftScore=0;
        rightScore=0;
        gameOver = false;
        serveCount=0;
        serverSide='left';
        ballLeft.classList.remove('active');
        ballRight.classList.remove('active');
        render();
    });
}
function resetAll(){
    showConfirm("确定要全部清零？比分、胜局、计时全部清空，选手名字保留。", function(){
        leftScore=0;
        rightScore=0;
        winLeft=0;
        winRight=0;
        gameOver=false;
        seconds=0;
        serveCount=0;
        serverSide='left';
        stopTimer();
        timerDom.innerText="比赛时间：00:00";
        ballLeft.classList.remove('active');
        ballRight.classList.remove('active');
        render();
    });
}
function startTimer(){
    if(timerInterval) return;
    timerInterval = setInterval(()=>{
        seconds++;
        const min = String(Math.floor(seconds/60)).padStart(2,'0');
        const sec = String(seconds%60).padStart(2,'0');
        timerDom.innerText=`比赛时间：${min}:${sec}`;
    },1000);
}
function stopTimer(){
    clearInterval(timerInterval);
    timerInterval=null;
}
render();
</script>
</body>
</html>
