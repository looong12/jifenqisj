<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>乒乓球记分器</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="container">
    <div class="confirm-mask" id="confirmMask">
        <div class="confirm-box">
            <div class="confirm-title">提示</div>
            <div class="confirm-text" id="confirmText"></div>
            <div class="btn-option-group" id="optionGroup" style="display:none;">
            </div>
            <div class="confirm-btns" id="confirmBtnWrap">
                <button class="confirm-cancel" id="confirmCancelBtn">取消</button>
                <button class="confirm-ok" id="confirmOkBtn">确定</button>
            </div>
        </div>
    </div>
    <div class="head-line">
        <div id="timer">比赛时间：00:00</div>
        <div id="setInfo">赛制：不限局数</div>
    </div>
    <div class="score-box">
        <div class="team">
            <div class="name-row">
                <span id="ballLeft" class="ball"></span>
                <input id="nameLeft" class="name-input name-red" placeholder="选手A" value="选手A">
            </div>
            <span class="game-count">胜局：<span id="winLeft">0</span></span>
            <div class="score-wrap">
                <div class="btn-group">
                    <button class="add">+</button>
                    <button class="sub">−</button>
                </div>
                <div class="score-holder">
                    <div class="score score-red" id="scoreLeft">0</div>
                </div>
                <div></div>
            </div>
        </div>
        <div class="team">
            <div class="name-row right-ball">
                <span id="ballRight" class="ball"></span>
                <input id="nameRight" class="name-input name-blue" placeholder="选手B" value="选手B">
            </div>
            <span class="game-count">胜局：<span id="winRight">0</span></span>
            <div class="score-wrap">
                <div></div>
                <div class="score-holder">
                    <div class="score score-blue" id="scoreRight">0</div>
                </div>
                <div class="btn-group">
                    <button class="add">+</button>
                    <button class="sub">−</button>
                </div>
            </div>
        </div>
    </div>
    <div class="ctrl">
        <button id="btnResetGame">重置本局</button>
        <button id="btnResetAll">全部清零</button>
        <button id="switchServerBtn">切换发球</button>
        <button id="toggleTimerBtn">开始计时</button>
        <button id="btnOpenSet">选择局数</button>
    </div>
</div>
<script src="./js/app.js"></script>
</body>
</html>
